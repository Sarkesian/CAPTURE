[package]
name = "capture-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CAPTURE desktop UI (Tauri 2). Spawns and supervises capture-worker."

[[bin]]
name = "CAPTURE"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
serde_json.workspace = true

[dependencies]
capture-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
# Release-zip updates: extraction (deflate only) and SHA-256 verification.
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10.9"
# Detect a missing WebView2 runtime before creating any window.
webview2-com = "0.39.1"
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
] }
