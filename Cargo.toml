[workspace]
resolver = "2"
members = ["crates/capture-protocol", "crates/capture-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows-core = "0.62"
windows = "0.62"
ffmpeg-sys-next = "9.0.1"
capture-protocol = { path = "crates/capture-protocol" }

[profile.release]
debug = 1          # symbols for crash diagnosis; stripped from nothing user-visible
panic = "unwind"
