[workspace]
resolver = "2"
members = ["crates/capture-protocol", "crates/capture-engine", "crates/capture-hook", "crates/capture-inject32", "crates/hook-testapp", "app/src-tauri"]
exclude = ["spikes/audio_spike", "spikes/libav_spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.62"
windows = "0.62"
ffmpeg-sys-next = { version = "9.0.1", default-features = false, features = ["avcodec", "avformat", "swscale", "swresample"] }
capture-protocol = { path = "crates/capture-protocol" }

[profile.release]
debug = 1          # symbols for crash diagnosis; stripped from nothing user-visible
panic = "unwind"

# bindgen (ffmpeg-sys-next build script) overflows its stack when built unoptimized.
[profile.dev.build-override]
opt-level = 3
