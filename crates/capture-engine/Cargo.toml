[package]
name = "capture-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CAPTURE native capture engine: WGC video, WASAPI audio, libav encode, disk replay ring"

[lib]
path = "src/lib.rs"

[[bin]]
name = "capture-worker"
path = "src/bin/capture-worker.rs"

[dependencies]
capture-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ffmpeg-sys-next.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
windows-core.workspace = true
windows = { workspace = true, features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Devices_Display",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
