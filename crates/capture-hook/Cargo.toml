[package]
name = "capture-hook"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "In-game overlay hook: loaded into a game by the capture worker, draws CAPTURE's notices inside the game's frames"

[lib]
name = "capture_hook"
crate-type = ["cdylib"]

[dependencies]
capture-protocol.workspace = true
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "encoder", "block_encoder"] }
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D9",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Performance",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
